[package]
name = "sylvester-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/sylvester"
description = "sylv, the command line interface of the sylvester Gröbner engine"
readme = "README.md"

[[bin]]
name = "sylv"
path = "src/main.rs"

[dependencies]
sylvester = { version = "0.3.0", path = "../.." }
clap = { version = "4.6", features = ["derive"] }
