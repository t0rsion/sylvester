[package]
name = "sylvester"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/sylvester"
description = "Gröbner bases and finite quotient algebras over prime fields and the rationals, with independent prime-field certificate verifiers"
readme = "README.md"
exclude = ["/benchmarks"]
keywords = ["groebner", "f4", "algebra", "polynomial", "mathematics"]
categories = ["mathematics", "science", "algorithms"]

[workspace]
members = ["crates/sylvester-cli", "crates/sylvester-py"]
# The benchmark runner is a package of its own with its own lock file, and
# the protocol under benchmarks/gb-comparison relies on that. Without this
# entry the workspace would capture it.
exclude = ["benchmarks/gb-comparison/runner"]

[lints.clippy]
cognitive_complexity = "warn"

[dependencies]
hashbrown = "0.15"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2.0"
smallvec = "1.11"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "groebner"
harness = false
