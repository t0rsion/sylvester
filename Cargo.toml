[package]
name = "sylvester"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/sylvester"
description = "Gröbner bases over prime fields with F4/F5 engines and independent certificate verifiers"
readme = "README.md"
exclude = [
    "/.gitattributes",
    "/.github",
    "/.gitignore",
    "/AGENTS.md",
    "/benchmarks",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/clippy.toml",
    "/deny.toml",
    "/docs",
    "/KNOWN_ISSUES.md",
    "/PLAN.md",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
]
keywords = ["groebner", "f4", "algebra", "polynomial", "certificate"]
categories = ["mathematics", "science", "algorithms"]

[lints.clippy]
cognitive_complexity = "warn"

[dependencies]
hashbrown = "0.15"
rustc-hash = "2.0"
smallvec = "1.11"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "groebner"
harness = false
