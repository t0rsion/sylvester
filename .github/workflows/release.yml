name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"$" Cargo.toml || { echo "Cargo.toml does not declare version $TAG"; exit 1; }

  preflight:
    needs: check-version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to lie on the tested main history
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Test the workspace at the tag
        run: cargo +1.92.0 test --workspace --locked
      - name: Package and test inside the extracted package
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          cargo +1.92.0 package --locked
          PKG_DIR=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")/pkg
          mkdir -p "$PKG_DIR"
          tar xzf target/package/sylvester-*.crate -C "$PKG_DIR"
          cd "$PKG_DIR"/sylvester-*
          cargo +1.92.0 test --locked

  crates-io:
    # Publication is irreversible, so every fallible build and test job runs
    # first.
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Publish unless this version is already on crates.io
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -sf -A "sylvester-release-ci" "https://crates.io/api/v1/crates/sylvester/$V" > /dev/null; then
            echo "sylvester $V already published; skipping"
          else
            cargo +1.92.0 publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: crates-io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build the crate archive and its checksum
        run: |
          cargo +1.92.0 package --locked
          cd target/package
          sha256sum sylvester-*.crate > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/package/sylvester-*.crate
            target/package/SHA256SUMS
