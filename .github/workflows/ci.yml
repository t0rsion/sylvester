name: CI

on:
  push:
    branches: [main, v0.3, v0.4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - run: cargo +1.92.0 fmt --all --check
      - run: cargo +1.92.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.92.0 doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Keep release versions in the changelog
        run: |
          if grep -En '(^|[^[:alnum:]])v[0-9]+\.[0-9]+|[Vv]ersion [0-9]+\.[0-9]+|sylvester [0-9]+\.[0-9]+\.[0-9]+' \
            README.md KNOWN_ISSUES.md docs/*.md \
            crates/sylvester-cli/README.md crates/sylvester-py/README.md; then
            exit 1
          fi
      - name: Enforce the cyclomatic-complexity limit
        run: |
          python3 -m pip install lizard==1.24.0
          lizard -l rust -C 10 -w \
            src tests benches examples benchmarks/gb-comparison \
            crates/sylvester-cli/src crates/sylvester-cli/tests \
            crates/sylvester-py/src crates/sylvester-py/tests
      - name: Check the benchmark harness
        run: |
          python3 -m pip install ruff==0.16.4
          ruff check benchmarks/gb-comparison
          ruff format --check benchmarks/gb-comparison
          python3 -m unittest discover -s benchmarks/gb-comparison -p 'test_*.py'
      - name: Check release-data privacy
        run: |
          if git ls-files --error-unmatch benchmarks/gb-comparison/results.json \
            > /dev/null 2>&1; then
            echo "the raw benchmark record is tracked"
            exit 1
          fi
          PRIVATE_DOCS='(^|/)(AGENTS|CLAUDE|PLAN)\.md$'
          if git ls-files | grep -E "$PRIVATE_DOCS"; then
            echo "a private planning document is tracked"
            exit 1
          fi
          LOCAL_PATHS='(/home/|/Users/|[A-Za-z]:[/\\]+Users[/\\])'
          EMAIL='[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          if git grep -n -I -E "$LOCAL_PATHS" -- \
            ':!Cargo.lock' ':!.github/workflows/ci.yml'; then
            exit 1
          fi
          if git grep -n -I -E "$EMAIL" -- \
            ':!LICENSE-*' ':!CITATION.cff' ':!.github/workflows/ci.yml'; then
            exit 1
          fi
          for record in $(git ls-files '*.zst'); do
            if zstdcat "$record" | grep -E "$LOCAL_PATHS|$EMAIL"; then
              exit 1
            fi
          done
          (cd benchmarks/gb-comparison && grep 'results.json.zst$' SHA256SUMS | sha256sum -c -)
          EXPECTED=$(awk '$2 == "results.json" { print $1 }' benchmarks/gb-comparison/SHA256SUMS)
          ACTUAL=$(zstdcat benchmarks/gb-comparison/results.json.zst | sha256sum | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED"
      - name: Scan for secrets
        run: |
          python3 -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(target[^/]*|\.git|\.pytest_cache|\.ruff_cache)/' \
            > "$RUNNER_TEMP/detect-secrets.json"
          python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); sys.exit(bool(data["results"]))' \
            "$RUNNER_TEMP/detect-secrets.json"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --workspace --locked

  slow-sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --release --test differential --locked -- --ignored
      - run: cargo +1.92.0 test --release --test f4_engine --locked -- --ignored

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 test --workspace --locked

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build and test the extracted library crate
        run: |
          cargo +1.92.0 package -p sylvester --locked
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/sylvester-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/sylvester-*
          cargo +1.92.0 test --locked
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python -m pip install "maturin>=1.12,<2" pytest
      - run: maturin build --release --locked --out dist
        working-directory: crates/sylvester-py
      - name: Install the wheel
        working-directory: crates/sylvester-py
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - run: python -m pytest tests
        working-directory: crates/sylvester-py

  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python -m pip install "maturin>=1.12,<2" pytest
      - name: Build the wheel and source distribution
        working-directory: crates/sylvester-py
        run: |
          maturin build --release --locked --out "$RUNNER_TEMP/dist"
          maturin sdist --out "$RUNNER_TEMP/dist"
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install pytest
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from importlib import metadata

          import sylvester

          assert metadata.version("sylvester") == sylvester.__version__
          ring = sylvester.PolynomialRing.prime_field(32003, ["x"])
          basis = ring.ideal([ring.parse("x^2 + 1")]).groebner_basis()
          assert str(basis[0]) == "x^2 + 1"
          PY
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest "$GITHUB_WORKSPACE/crates/sylvester-py/tests"
      - name: Test the installed source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install pytest "$RUNNER_TEMP"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest "$GITHUB_WORKSPACE/crates/sylvester-py/tests"

  python-sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install the optional extra
        working-directory: crates/sylvester-py
        run: python -m pip install ".[sympy]" pytest
      - name: Test the optional adapter
        working-directory: crates/sylvester-py
        run: python -m pytest tests/test_sympy.py
