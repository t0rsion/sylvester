name: CI

on:
  push:
    branches: [main, v0.2]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - run: cargo +1.92.0 fmt --all --check
      - run: cargo +1.92.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.92.0 doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Enforce the cyclomatic-complexity limit
        run: |
          python3 -m pip install lizard==1.24.0
          lizard -C 10 -w src tests benches examples benchmarks/gb-comparison \
            --exclude '*/records/*' --exclude '*/inputs/*' \
            --exclude '*/outputs/*' --exclude '*/target-*/*' \
            --exclude '*/bin/*'
      - name: Check the benchmark harness
        run: |
          python3 -m pip install ruff==0.16.4
          ruff check benchmarks/gb-comparison
          ruff format --check benchmarks/gb-comparison
          python3 -m unittest discover -s benchmarks/gb-comparison -p 'test_*.py'
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --workspace --locked

  slow-sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --release --test differential --locked -- --ignored
      - run: cargo +1.92.0 test --release --test f4_engine --locked -- --ignored

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 test --workspace --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 package --locked
      - name: Test inside the extracted package
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/sylvester-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/sylvester-*
          cargo +1.92.0 test --locked
