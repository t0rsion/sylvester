name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - run: cargo +1.92.0 fmt --all --check
      - run: cargo +1.92.0 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.92.0 doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --workspace --locked
      - run: cargo +1.92.0 test --features parallel --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 test --workspace --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 package --locked
      - name: Test inside the extracted package
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/sylvester-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/sylvester-*
          cargo +1.92.0 test
